<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binny's Deals</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 1200px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    h1 { font-size: 1.4rem; margin: 0; }
    .meta { opacity: 0.7; font-size: 0.85rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
    .controls input, .controls select, .controls button {
      padding: 0.4rem 0.6rem; font-size: 0.9rem; border-radius: 6px; border: 1px solid #8884;
      background: transparent; color: inherit;
    }
    .controls button { cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 0.5rem 0.6rem; text-align: left; border-bottom: 1px solid #8882; vertical-align: middle; }
    th { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; opacity: 0.7; }
    img.thumb { width: 48px; height: 48px; object-fit: contain; background: #fff2; border-radius: 4px; }
    .pct { font-weight: 600; color: #1a9d4a; }
    .strike { text-decoration: line-through; opacity: 0.6; margin-left: 0.4rem; font-size: 0.85rem; }
    a.name { color: inherit; text-decoration: none; }
    a.name:hover { text-decoration: underline; }
    .empty { padding: 2rem; text-align: center; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>Binny's Deals</h1>
    <span class="meta" id="last-scraped">
      {% if last_scraped_at %}Last scraped: {{ last_scraped_at }}{% else %}Never scraped{% endif %}
    </span>
  </header>

  <div class="controls">
    <select id="category">
      <option value="">All categories</option>
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
    <input id="min-pct" type="number" min="0" max="100" step="1" placeholder="Min % off">
    <input id="max-price" type="number" min="0" step="1" placeholder="Max price ($)">
    <select id="sort">
      <option value="percent_off">Sort: % off</option>
      <option value="sale_price">Sort: price</option>
      <option value="name">Sort: name</option>
    </select>
    <button id="apply">Apply</button>
    <button id="refresh">Refresh from site</button>
  </div>

  <table id="deals">
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>% Off</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="empty" class="empty" hidden>No deals yet. Click "Refresh from site".</div>

  <script>
    const tbody = document.querySelector('#deals tbody');
    const emptyEl = document.getElementById('empty');
    const lastEl = document.getElementById('last-scraped');

    function fmtPrice(n) { return n == null ? '' : '$' + n.toFixed(2); }

    function render(deals) {
      tbody.innerHTML = '';
      if (!deals.length) { emptyEl.hidden = false; return; }
      emptyEl.hidden = true;
      for (const d of deals) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.image_url ? `<img class="thumb" src="${d.image_url}" alt="">` : ''}</td>
          <td><a class="name" href="${d.url}" target="_blank" rel="noopener">${d.name}</a></td>
          <td>${d.category ?? ''}</td>
          <td>${fmtPrice(d.sale_price)}${
            d.regular_price && d.regular_price !== d.sale_price
              ? `<span class="strike">${fmtPrice(d.regular_price)}</span>` : ''
          }</td>
          <td class="pct">${d.percent_off != null ? d.percent_off + '%' : ''}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function load() {
      const params = new URLSearchParams();
      const cat = document.getElementById('category').value;
      const minPct = document.getElementById('min-pct').value;
      const maxPrice = document.getElementById('max-price').value;
      const sort = document.getElementById('sort').value;
      if (cat) params.set('category', cat);
      if (minPct) params.set('min_percent_off', minPct);
      if (maxPrice) params.set('max_price', maxPrice);
      if (sort) params.set('sort', sort);
      const r = await fetch('/api/deals?' + params);
      const data = await r.json();
      if (data.last_scraped_at) lastEl.textContent = 'Last scraped: ' + data.last_scraped_at;
      render(data.deals);
    }

    document.getElementById('apply').addEventListener('click', load);
    document.getElementById('refresh').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.textContent = 'Refreshing…';
      try {
        const r = await fetch('/api/refresh', { method: 'POST' });
        if (r.status === 409) alert('A refresh is already running.');
        else if (!r.ok) alert('Refresh failed: ' + r.status);
        await load();
      } finally {
        e.target.disabled = false;
        e.target.textContent = 'Refresh from site';
      }
    });

    load();
  </script>
</body>
</html>
